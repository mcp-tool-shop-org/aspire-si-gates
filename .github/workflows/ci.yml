name: ci

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/**
      - tests/**
      - atlas/**
      - site/package*.json
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pytest-cov
      - run: python -m pytest -q --cov=src/aspire_si_gates --cov-report=term --cov-fail-under=68
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: 22
      - if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - if: matrix.python-version == '3.12'
        name: Audit the site's npm tree (the package itself has no dependencies)
        working-directory: site
        run: npm ci && npm audit --audit-level=high
