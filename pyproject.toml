[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-si-gates"
version = "1.7.6"
description = "The Stage 1 role-training data gates (schema, amendments, diversity, floors), standard library only"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop" }]
keywords = ["dataset", "validation", "training-data", "gates", "quality-gates", "llm", "role-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/aspire-si-gates/"
Repository = "https://github.com/mcp-tool-shop-org/aspire-si-gates"
Changelog = "https://github.com/mcp-tool-shop-org/aspire-si-gates/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/aspire-si-gates/issues"

[tool.setuptools.packages.find]
where = ["src"]
